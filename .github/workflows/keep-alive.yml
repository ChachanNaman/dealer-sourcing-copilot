name: keep-alive

# Render's free tier spins the API down after ~15 min idle, and a cold start is
# 50s+ — which kills a link opened from WhatsApp. This pings /health every ~10
# min to keep the instance warm. (GitHub disables scheduled workflows after 60
# days of repo inactivity; re-enable from the Actions tab if that happens.)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          curl -sS -m 90 -o /dev/null -w "health %{http_code} in %{time_total}s\n" \
            https://dealer-copilot-api.onrender.com/health || true
